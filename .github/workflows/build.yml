name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # libmpv video engine (pinned build; cached so a deleted upstream release can't break us)
      - name: Cache libmpv
        uses: actions/cache@v4
        with:
          path: libmpv
          key: libmpv-20261020-x86_64

      - name: Get libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MPV_TAG: '20261020'
        run: |
          if (Test-Path libmpv/libmpv-2.dll) { "libmpv from cache"; exit 0 }
          New-Item -ItemType Directory -Force libmpv, libmpv-dl | Out-Null
          gh release download $env:MPV_TAG -R shinchiro/mpv-winbuild-cmake -p 'mpv-dev-x86_64-2*' -D libmpv-dl
          if ($LASTEXITCODE -ne 0) {
            "Pinned libmpv release $env:MPV_TAG not found, using the latest one"
            gh release download -R shinchiro/mpv-winbuild-cmake -p 'mpv-dev-x86_64-2*' -D libmpv-dl
            if ($LASTEXITCODE -ne 0) { throw "could not download libmpv" }
          }
          $archive = Get-ChildItem libmpv-dl -Filter *.7z | Select-Object -First 1
          7z x $archive.FullName -olibmpv-x -y | Out-Null
          $dll = Get-ChildItem libmpv-x -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in $($archive.Name)" }
          Copy-Item $dll.FullName libmpv/
          "Got $($archive.Name)"

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          # main: <VERSION file>.<run number>, released automatically
          # tags v*: the tag's version, released
          # other branches: 0.0.<run number>, build artifact only
          $release = 'false'
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $v = "$((Get-Content VERSION -Raw).Trim()).$env:GITHUB_RUN_NUMBER"
            $release = 'true'
          } elseif ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            $release = 'true'
          } else {
            $v = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish GlassPlayer/GlassPlayer.csproj -c Release -r win-x64
          -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath GlassPlayer-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GlassPlayer-win-x64
          path: GlassPlayer-win-x64.zip

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title $tag --generate-notes
          }
          gh release upload $tag GlassPlayer-win-x64.zip --clobber
